version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: thru_oracle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: thru_oracle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thru_oracle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
