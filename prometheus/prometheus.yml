global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: thru-betanet
    environment: staging-t0

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: thru_oracle_api
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080
          - 127.0.0.1:8080
        labels:
          tier: T0
          app: thru-oracle-daemon
