name: Quant Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Verify Architectural Simulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: false

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Run Clean Verification & Benchmark Suite
        run: bash scripts/verify_reproduce.sh
