name: Quant Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  contracts-c:
    name: C Contracts & Unit Tests (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Run C Unit, Hardening, and Golden Tests
        run: |
          make test
          make test-simulation
          make test-hardening
          make test-math-golden
          make test-math-checked
          make test-v2-math
          make test-v2-golden
          make test-v2-contracts
          make test-c-consumer
          make bench-math
          make clean-tests

  contract-parser-fuzz:
    name: Contract Parser & Math Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Run Differential Math and Contract Parser Fuzzers
        run: |
          make fuzz-math
          make fuzz-contracts

  coverage-gate:
    name: Code Coverage Gate (C & Go >= 85%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: false

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make gcovr

      - name: Evaluate Coverage Thresholds
        run: make coverage

  go-backend:
    name: Go Backend & Quorum Feeder (-race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: false

      - name: Run Go Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Go Daemons & Run Benchmarks
        run: |
          make build-api
          make build-feeder
          make bench-api

  services-and-sdk:
    name: TypeScript Services, SDK & Remediation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and Test SDK, Indexer, Gateway, and MCP
        run: |
          make build-sdk
          make test-sdk
          cd indexer && ([ -d node_modules ] || npm install --silent) && npm run build && cd ..
          make test-indexer
          cd gateway && ([ -d node_modules ] || npm install --silent) && npm run build && cd ..
          make test-gateway
          cd mcp && ([ -d node_modules ] || npm install --silent) && npm run build && cd ..
          make test-mcp
          make test-audit-remediation
          make run-example

  claims-and-lint:
    name: Claims Linter, C Static Checks & Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Run Linters & Claim Verification
        run: |
          make lint-c
          make lint-claims
          make verify-claims
          make check-links

  rv64imc-build:
    name: RISC-V RV64IMC Contract Build & ABI Codegen Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Thru CLI and Toolchain
        run: |
          npm install -g thru@0.4.2
          mkdir -p ~/.thru/sdk/toolchain ~/.thru/sdk/c
          curl -sL https://github.com/Unto-Labs/thru/releases/download/v0.4.2/thru-toolchain-Linux-x86_64-v0.4.2.tar.gz | tar -xz --strip-components=1 -C ~/.thru/sdk/toolchain
          curl -sL https://github.com/Unto-Labs/thru/releases/download/v0.4.2/thru-program-sdk-c-v0.4.2.tar.gz | tar -xz --strip-components=1 -C ~/.thru/sdk/c
          make -C ~/.thru/sdk/c BASEDIR=~/.thru/sdk/c/ BUILDDIR=thru-sdk all lib include

      - name: Verify ABI Codegen Parity
        run: |
          make codegen-abi
          git diff --exit-code sdk/src/generated

      - name: Build RV64IMC Binary and Verify Size & SHA-256
        run: |
          make build-rv64
